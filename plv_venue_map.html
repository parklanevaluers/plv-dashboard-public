<style>
:root { --plv-navy:#0B2545; --tl-green:#2E8B57; --tl-amber:#E0A82E; --tl-red:#C44A3A; --tl-black:#111; --tl-grey:#B4BAC4; }
* { box-sizing:border-box; }
body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif; color:#1a2438; }
header { background:var(--plv-navy); color:white; padding:10px 18px; display:flex; gap:18px; align-items:center; flex-wrap:wrap; }
header h1 { margin:0; font-size:17px; font-weight:500; }
header .meta { font-size:12px; opacity:0.85; }
.controls { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-left:auto; }
.controls button { font-size:12px; padding:4px 8px; border-radius:3px; border:none; background:white; color:var(--plv-navy); cursor:pointer; font-weight:500; }
.controls .chip { display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.25); padding:3px 10px; border-radius:12px; font-size:11px; cursor:pointer; user-select:none; }
.controls .chip input { margin:0; }
.controls .chip .sw { width:10px; height:10px; border-radius:50%; display:inline-block; border:1.5px solid rgba(255,255,255,0.4); }
#map { height: calc(100vh - 56px); width:100vw; }
.legend { background:white; padding:10px 14px; border-radius:6px; box-shadow:0 1px 4px rgba(0,0,0,0.15); font-size:12px; min-width:190px; }
.legend h4 { margin:0 0 6px; font-size:11px; color:#666; text-transform:uppercase; letter-spacing:0.05em; font-weight:600; }
.legend .row { display:flex; align-items:center; gap:8px; margin-bottom:3px; }
.legend .dot { width:12px; height:12px; border-radius:50%; display:inline-block; border:1.5px solid white; box-shadow:0 0 0 1px rgba(0,0,0,0.2); }
.legend .sz { display:flex; gap:8px; align-items:center; margin-top:8px; padding-top:8px; border-top:1px solid #eee; flex-wrap:wrap; }
.legend .sz span { display:inline-flex; align-items:center; gap:4px; font-size:11px; color:#555; }
.legend .sz i { display:inline-block; border-radius:50%; background:#2E8B57; border:1.5px solid white; box-shadow:0 0 0 1px rgba(0,0,0,0.2); }
.plv-pie { background:transparent !important; border:none !important; }
.plv-pie svg { display:block; filter:drop-shadow(0 0 1px rgba(0,0,0,0.3)); }
.popup-ttl { font-weight:600; color:var(--plv-navy); margin-bottom:4px; font-size:13px; }
.popup-meta { font-size:11px; line-height:1.5; color:#444; }
.popup-meta .badge { display:inline-block; padding:1px 6px; border-radius:8px; color:white; font-size:10px; font-weight:600; }
.popup-meta .kv { display:flex; justify-content:space-between; padding:1px 0; }
.popup-meta .kv .k { color:#666; }
.popup-meta .kv .v { font-weight:500; }
.evlist { margin-top:6px; padding-top:4px; border-top:1px solid #eee; max-height:180px; overflow-y:auto; }
.evrow { display:flex; align-items:center; gap:6px; padding:2px 0; font-size:11px; }
.evrow .ebadge { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.evrow .edate { color:#666; width:76px; flex-shrink:0; }
.evrow .eprofit { font-weight:600; margin-left:auto; }
</style>

const TL = { green:"#2E8B57", amber:"#E0A82E", red:"#C44A3A", black:"#111", grey:"#B4BAC4" };
const TL_LABEL = { green:"Green", amber:"Amber", red:"Red", black:"Black (loss)", grey:"No data" };

function bandOf(profit) {
  if (profit == null) return null;
  if (profit < 0) return "black";
  if (profit < 1000) return "red";
  if (profit < 4000) return "amber";
  return "green";
}
function venueBands(v) {
  const bands = [];
  (v.ev || []).forEach(e => { const b = bandOf(e.p); if (b) bands.push(b); });
  return bands;
}
function primaryBand(v) {
  const bs = venueBands(v);
  if (!bs.length) return "grey";
  const freq = {};
  bs.forEach(b => freq[b] = (freq[b] || 0) + 1);
  const order = ["black","red","amber","green"];
  let best = null, bestCount = -1;
  order.forEach(b => { if ((freq[b] || 0) > bestCount) { best = b; bestCount = freq[b] || 0; } });
  return best || "grey";
}

const map = L.map('map', { preferCanvas: false }).setView([54.5, -3.0], 6);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  maxZoom: 19
}).addTo(map);

function fmtDate(d) { if (!d) return '—'; const dt = new Date(d); if (isNaN(dt)) return d; return dt.toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' }); }
function fmtDateShort(d) { if (!d) return '—'; const dt = new Date(d); if (isNaN(dt)) return d; return dt.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'2-digit' }); }
function fmtMoney(n) { if (n == null || isNaN(n)) return '—'; const sign = n < 0 ? '-£' : '£'; return sign + Math.abs(Number(n)).toLocaleString('en-GB', { maximumFractionDigits: 0 }); }
function esc(s){ return String(s||'').replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function markerRadius(events) { if (!events) return 5; if (events < 4) return 7; if (events < 10) return 10; if (events < 20) return 13; return 17; }

function pieIcon(bands, radius) {
  const n = bands.length, r = radius, size = r * 2 + 4, cx = size/2, cy = size/2;
  let paths = "";
  if (n === 1) {
    paths = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${TL[bands[0]]}" stroke="white" stroke-width="1.5"/>`;
  } else {
    const step = (2 * Math.PI) / n;
    for (let i = 0; i < n; i++) {
      const a0 = -Math.PI/2 + i * step, a1 = -Math.PI/2 + (i+1) * step;
      const x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0);
      const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
      const large = (step > Math.PI) ? 1 : 0;
      paths += `<path d="M ${cx} ${cy} L ${x0} ${y0} A ${r} ${r} 0 ${large} 1 ${x1} ${y1} Z" fill="${TL[bands[i]]}"/>`;
    }
    paths += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="white" stroke-width="1.5"/>`;
  }
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${paths}</svg>`;
  return L.divIcon({ className: 'plv-pie', html: svg, iconSize: [size, size], iconAnchor: [size/2, size/2], popupAnchor: [0, -r] });
}

let layer = L.layerGroup().addTo(map);
function render() {
  layer.clearLayers();
  const show = { green: document.getElementById('f-green').checked, amber: document.getElementById('f-amber').checked, red: document.getElementById('f-red').checked, black: document.getElementById('f-black').checked, grey: document.getElementById('f-grey').checked };
  const bounds = [];
  VENUES.forEach(v => {
    if (typeof v.lat !== 'number' || typeof v.lng !== 'number') return;
    const bands = venueBands(v);
    const unique = [...new Set(bands)];
    const primary = bands.length ? primaryBand(v) : 'grey';
    const bandsForFilter = bands.length ? unique : ['grey'];
    if (!bandsForFilter.some(b => show[b])) return;
    const r = markerRadius(v.events || 0);
    let marker;
    if (bands.length <= 1) {
      const colour = bands.length ? TL[bands[0]] : TL.grey;
      marker = L.circleMarker([v.lat, v.lng], { radius: r, fillColor: colour, color: 'white', weight: 1.5, opacity: 1, fillOpacity: bands.length ? 0.9 : 0.55 });
    } else {
      marker = L.marker([v.lat, v.lng], { icon: pieIcon(bands, r) });
    }
    const addrParts = [v.addr, v.town, v.pc].filter(Boolean).map(esc).join(', ');
    const badges = (unique.length ? unique : ['grey']).map(b => `<span class="badge" style="background:${TL[b]}">${TL_LABEL[b]}</span>`).join(' ');
    const evRows = (v.ev || []).map(e => {
      const b = bandOf(e.p) || 'grey';
      return `<div class="evrow"><span class="ebadge" style="background:${TL[b]}"></span><span class="edate">${esc(fmtDateShort(e.d))}</span><span class="eprofit" style="color:${TL[b]}">${fmtMoney(e.p)}</span></div>`;
    }).join('');
    const popup = '<div class="popup-ttl">' + esc(v.name || '(no name)') + '</div>' +
      '<div class="popup-meta">' + badges +
        (v.events ? ' <span style="background:#333;color:white;padding:1px 6px;border-radius:8px;font-size:10px;">' + v.events + ' events</span>' : '') +
        '<br>' + (addrParts || '<em style="color:#888">no address</em>') +
        '<div style="margin-top:6px; padding-top:4px; border-top:1px solid #eee;">' +
          '<div class="kv"><span class="k">Avg profit/event</span><span class="v">' + fmtMoney(v.rev) + '</span></div>' +
          (v.status ? '<div class="kv"><span class="k">Status</span><span class="v">' + esc(v.status) + '</span></div>' : '') +
          (v.owner ? '<div class="kv"><span class="k">Default owner</span><span class="v">' + esc(v.owner) + '</span></div>' : '') +
        '</div>' +
        (evRows ? '<div class="evlist"><div style="font-size:10px;color:#888;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:3px;">Events (' + (v.ev || []).length + ')</div>' + evRows + '</div>' : '') +
      '</div>';
    marker.bindPopup(popup, { maxHeight: 360 });
    const tipLabel = unique.length > 1 ? `${unique.length} categories (${unique.map(b=>TL_LABEL[b]).join(' + ')})` : (bands.length ? TL_LABEL[primary] : 'No profit data');
    marker.bindTooltip(esc(v.name || '') + (v.town ? ' &middot; ' + esc(v.town) : '') + '<br>' + tipLabel, { sticky:true });
    marker.addTo(layer);
    bounds.push([v.lat, v.lng]);
  });
  return bounds;
}

let lastBounds = render();
['f-green','f-amber','f-red','f-black','f-grey'].forEach(id => document.getElementById(id).onchange = () => { lastBounds = render(); });
document.getElementById('fit').onclick = () => { if (lastBounds.length) map.fitBounds(lastBounds, { padding:[40,40], maxZoom: 11 }); };
if (lastBounds.length) map.fitBounds(lastBounds, { padding:[40,40], maxZoom: 9 });

legend.onAdd = () => {
  const div = L.DomUtil.create('div', 'legend');
  div.innerHTML = '<h4>Profit per event</h4>' +
    '<div class="row"><span class="dot" style="background:#2E8B57"></span>Green &middot; &pound;4,000+</div>' +
    '<div class="row"><span class="dot" style="background:#E0A82E"></span>Amber &middot; &pound;1,000&ndash;3,999</div>' +
    '<div class="row"><span class="dot" style="background:#C44A3A"></span>Red &middot; &pound;0&ndash;999</div>' +
    '<div class="row"><span class="dot" style="background:#111"></span>Black &middot; a loss</div>' +
    '<div class="row"><span class="dot" style="background:#B4BAC4"></span>No profit data</div>' +
    '<div style="margin-top:6px; padding-top:6px; border-top:1px solid #eee; font-size:11px; color:#666;">Mixed-band venues show as pie slices, newest event first. Click for breakdown.</div>' +
    '<div class="sz">' +
      '<span><i style="width:10px;height:10px"></i>0</span>' +
      '<span><i style="width:14px;height:14px"></i>1-3</span>' +
      '<span><i style="width:20px;height:20px"></i>4-9</span>' +
      '<span><i style="width:26px;height:26px"></i>10-19</span>' +
      '<span><i style="width:34px;height:34px"></i>20+</span>' +
    '</div>';
  return div;
};
legend.addTo(map);
